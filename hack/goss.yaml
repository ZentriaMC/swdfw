---
command:
  ssh-accessible:
    exec: "whoami"
    exit-status: 0
    stdout:
      - "core"
  sudo-works:
    exec: "sudo whoami"
    exit-status: 0
    stdout:
      - "root"
  nft-exists:
    exec: "which nft"
    exit-status: 0
  iptables-exists:
    exec: "which iptables"
    exit-status: 0
